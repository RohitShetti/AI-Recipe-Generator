  <!-- Right Leaf -->
  <path d="M32 23 C37 19 44 20 42 12 C35 13 33 19 32 23 Z" fill="#4ade80" />
  <!-- Stem -->
  <path d="M32 24 Q32 28 32 30" stroke="#16a34a" stroke-width="2" stroke-linecap="round" fill="none" />

  <!-- Culinary Stars / Sparkles -->
  <path d="M47 14 Q47 18 49 18 Q47 18 47 22 Q47 18 45 18 Q47 18 47 14 Z" fill="url(#sparkleGrad)" />
  <circle cx="15" cy="18" r="1.5" fill="#fef08a" />
