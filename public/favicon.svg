  <line x1="22" y1="43" x2="42" y2="43" stroke="#e2e8f0" stroke-width="1.5" stroke-linecap="round" />

  <!-- Chef Hat Puffs -->
  <path d="M19 39 C15 39 13 32 17 27 C15 22 22 17 27 20 C30 15 38 15 40 21 C45 18 50 23 48 29 C52 33 50 39 45 39 Z" fill="#ffffff" />

  <!-- Fresh Organic Sprout / Herb Leaves (Vegetarian Emblem) -->
  <!-- Left Leaf -->
